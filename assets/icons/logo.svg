<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#28407F"/>
      <stop offset="55%" stop-color="#182559"/>
      <stop offset="100%" stop-color="#0D1636"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6D488"/>
      <stop offset="50%" stop-color="#E0A93A"/>
      <stop offset="100%" stop-color="#A9781F"/>
    </linearGradient>
    <radialGradient id="nucleus" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F9E7B8"/>
      <stop offset="55%" stop-color="#E0A93A"/>
      <stop offset="100%" stop-color="#A9781F"/>
    </radialGradient>

    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6C7BAA"/>
      <stop offset="100%" stop-color="#454F79"/>
    </linearGradient>

    <linearGradient id="book1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6699EE"/>
      <stop offset="100%" stop-color="#2A53AB"/>
    </linearGradient>
    <linearGradient id="book1side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E6BC4"/>
      <stop offset="100%" stop-color="#1E3E85"/>
    </linearGradient>

    <linearGradient id="book2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C13D69"/>
      <stop offset="100%" stop-color="#8A2350"/>
    </linearGradient>
    <linearGradient id="book2side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C2E56"/>
      <stop offset="100%" stop-color="#6E1B40"/>
    </linearGradient>

    <linearGradient id="book3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1FA98F"/>
      <stop offset="100%" stop-color="#0C6857"/>
    </linearGradient>
    <linearGradient id="book3side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#188A75"/>
      <stop offset="100%" stop-color="#094F42"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- atom -->
  <g transform="translate(256,118)" fill="none" stroke-linecap="round">
    <ellipse cx="0" cy="0" rx="128" ry="46" stroke="#2DD4BF" stroke-width="11" transform="rotate(-6)"/>
    <ellipse cx="0" cy="0" rx="128" ry="46" stroke="#F472B6" stroke-width="11" transform="rotate(58)"/>
    <ellipse cx="0" cy="0" rx="128" ry="46" stroke="#60A5FA" stroke-width="11" transform="rotate(-64)"/>
    <circle cx="0" cy="0" r="17" fill="url(#nucleus)" stroke="#0D1636" stroke-width="1.5"/>
  </g>

  <!-- glasses -->
  <g transform="translate(256,222)">
    <!-- temple arms -->
    <path d="M -95 -8 L -140 -28 L -158 -8" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 95 -8 L 140 -28 L 158 -8" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- bridge -->
    <path d="M -18 -2 Q 0 -14 18 -2" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round"/>
    <!-- left lens -->
    <ellipse cx="-58" cy="0" rx="52" ry="38" fill="url(#lens)" stroke="url(#gold)" stroke-width="11"/>
    <path d="M -84 -14 Q -58 -30 -32 -14" fill="none" stroke="#C9D0E4" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <!-- right lens -->
    <ellipse cx="58" cy="0" rx="52" ry="38" fill="url(#lens)" stroke="url(#gold)" stroke-width="11"/>
    <path d="M 32 -14 Q 58 -30 84 -14" fill="none" stroke="#C9D0E4" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- book stack -->
  <g>
    <!-- book 1 -->
    <path d="M 90 320 L 405 320 L 422 336 L 422 388 L 107 388 L 90 372 Z" fill="url(#book1side)"/>
    <rect x="90" y="262" width="332" height="64" rx="12" fill="url(#book1)"/>
    <text x="256" y="303" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#F5EFE0">VOL. I</text>

    <!-- book 2 -->
    <path d="M 90 400 L 405 400 L 422 416 L 422 468 L 107 468 L 90 452 Z" fill="url(#book2side)"/>
    <rect x="90" y="342" width="332" height="64" rx="12" fill="url(#book2)"/>
    <text x="256" y="383" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#F5EFE0">VOL. II</text>

    <!-- book 3 -->
    <path d="M 90 480 L 405 480 L 422 496 L 422 486 L 107 486 L 90 480 Z" fill="url(#book3side)"/>
    <rect x="90" y="422" width="332" height="64" rx="12" fill="url(#book3)"/>
    <text x="256" y="463" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28" fill="#F5EFE0">VOL. III</text>
  </g>
</svg>
